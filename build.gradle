plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.1'
	id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot Starters
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	
	// AWS SES
	implementation 'com.amazonaws:aws-java-sdk-ses:1.12.629'
	
	// AWS S3
	implementation 'com.amazonaws:aws-java-sdk-s3:1.12.629'
	
	// SendGrid
	implementation 'com.sendgrid:sendgrid-java:4.10.1'
	
	// JavaMail for email attachments
	implementation 'com.sun.mail:jakarta.mail:2.0.1'
	implementation 'jakarta.activation:jakarta.activation-api:2.1.0'
	
	// Payment Gateways
	implementation 'com.razorpay:razorpay-java:1.4.6'
	implementation 'com.stripe:stripe-java:24.15.0'
	
	// H2 Database (in-memory for testing)
	runtimeOnly 'com.h2database:h2'
	
	// MySQL Driver (optional - can switch to MySQL)
	runtimeOnly 'com.mysql:mysql-connector-j'
	
	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	
	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	useJUnitPlatform()
}
