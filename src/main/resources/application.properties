# Server Configuration
server.port=8080
spring.application.name=springboot-email-demo

# Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# AWS SES Configuration
aws.ses.region=eu-north-1
aws.ses.access-key=YOUR_AWS_ACCESS_KEY
aws.ses.secret-key=YOUR_AWS_SECRET_KEY
aws.ses.from-email=your-email@example.com

# AWS S3 Configuration
aws.s3.region=eu-north-1
aws.s3.bucket-name=YOUR_S3_BUCKET_NAME
aws.s3.access-key=YOUR_AWS_ACCESS_KEY
aws.s3.secret-key=YOUR_AWS_SECRET_KEY

# SendGrid Configuration
sendgrid.api.key= ????????????????????
sendgrid.from.email=anan.abhisheek@gmail.com
sendgrid.from.name=Email Demo App

# Email Configuration
email.provider=sendgrid

# Razorpay Configuration (Test Mode)
razorpay.key.id=YOUR_RAZORPAY_KEY_ID
razorpay.key.secret=YOUR_RAZORPAY_KEY_SECRET

# Stripe Configuration (Test Mode)
stripe.api.key=sk_test_YOUR_STRIPE_SECRET_KEY


